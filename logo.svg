<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" width="250" height="250">
  <defs>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <linearGradient id="avatarGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c3fc5"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </linearGradient>
    <clipPath id="avatarClip">
      <circle cx="95" cy="95" r="48"/>
    </clipPath>
  </defs>

  <!-- Фон -->
  <rect width="250" height="250" rx="40" fill="#1a1a1a"/>

  <!-- Аватар: круг с силуэтом -->
  <circle cx="95" cy="95" r="48" fill="#2a2a2a" stroke="#c0a0ff" stroke-width="4"/>
  <!-- Голова -->
  <circle cx="95" cy="82" r="16" fill="#c0a0ff" opacity="0.9" clip-path="url(#avatarClip)" filter="url(#blur)"/>
  <!-- Тело -->
  <ellipse cx="95" cy="122" rx="26" ry="20" fill="#c0a0ff" opacity="0.9" clip-path="url(#avatarClip)" filter="url(#blur)"/>

  <!-- Строка имени (размытый прямоугольник) -->
  <rect x="155" y="72" width="68" height="14" rx="7" fill="#c0a0ff" opacity="0.85" filter="url(#blur)"/>
  <!-- Строка подписи (размытый прямоугольник, тоньше) -->
  <rect x="155" y="96" width="48" height="10" rx="5" fill="#c0a0ff" opacity="0.5" filter="url(#blur)"/>

  <!-- Иконка блюра / волны -->
  <g transform="translate(55, 158)" opacity="0.9">
    <path d="M0 20 Q17 0 35 20 Q52 40 70 20 Q87 0 105 20 Q122 40 140 20"
          fill="none" stroke="#c0a0ff" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 20 Q17 0 35 20 Q52 40 70 20 Q87 0 105 20 Q122 40 140 20"
          fill="none" stroke="#c0a0ff" stroke-width="5" stroke-linecap="round"
          opacity="0.35" transform="translate(0, 14)"/>
  </g>
</svg>
